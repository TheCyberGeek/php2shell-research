name: phase_c

services:
  php-fpm:
    build: .
    image: phase_c
    container_name: phase_c-fpm

  nginx:
    image: nginx:alpine
    container_name: phase_c-nginx
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php-fpm]
