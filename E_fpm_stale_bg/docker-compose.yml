name: phase_e

services:
  php-fpm:
    build: .
    image: phase_e
    container_name: phase_e-fpm

  nginx:
    image: nginx:alpine
    container_name: phase_e-nginx
    ports:
      - "127.0.0.1:8084:80"
    volumes:
      - ./conf/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [php-fpm]
